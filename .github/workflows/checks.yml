name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Workflow and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install embedded shell script analyzer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Install checksum-verified check tools
        id: tools
        run: python3 packaging/checks/install_tools.py --destination "$RUNNER_TEMP/mergedesk-check-tools"
      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/mergedesk-check-tools/actionlint" -color -shellcheck /usr/bin/shellcheck'
      - name: Scan checked-out source for secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/mergedesk-check-tools/gitleaks" dir . \
            --redact=100 --no-banner --no-color --timeout 300 \
            --max-archive-depth 2 --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json"
      - name: Linux packaging safety regressions
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s packaging/linux -p test_package.py -v
      - name: Release promotion safety regressions
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s packaging/release -p test_promote.py -v
      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-checks
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  source:
    name: Cppcheck · ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [unix64, win64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Analyze application production units
        env:
          CPPCHECK_PLATFORM: ${{ matrix.platform }}
        run: python3 packaging/checks/run_cppcheck.py --platform "$CPPCHECK_PLATFORM"
